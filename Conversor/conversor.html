<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conversor - Math</title>

    <link
        rel="stylesheet"
        href="conversor.css"
    >

</head>

<body>

    <div class="conversor">

        <button
            class="boton-volver"
            onclick="window.location.href='../index.html'">

            ← Volver al menú

        </button>


        <h1>🔄 Conversor</h1>


        <div class="conversor-panel">


            <!-- TIPO DE CONVERSIÓN -->

            <label>
                Tipo de conversión:
            </label>

            <select
                id="tipoConversion"
                onchange="cambiarTipoConversion()"
            >

                <option value="unidades">
                    Unidades
                </option>

                <option value="sistemas">
                    Sistemas numéricos
                </option>

            </select>


            <!-- CATEGORÍA -->

            <label>
                Categoría:
            </label>

            <select id="categoria">

                <option value="longitud">
                    Longitud
                </option>

                <option value="masa">
                    Masa
                </option>

                <option value="temperatura">
                    Temperatura
                </option>

            </select>


            <!-- CANTIDAD -->

            <label>
                Cantidad:
            </label>

            <input
                type="text"
                id="cantidad"
                placeholder="Ejemplo: 100"
            >


            <!-- ORIGEN -->

            <label>
                De:
            </label>

            <select id="unidadOrigen"></select>


            <!-- DESTINO -->

            <label>
                A:
            </label>

            <select id="unidadDestino"></select>


            <!-- BOTÓN -->

            <button
                class="boton-convertir"
                onclick="convertir()"
            >

                🔄 Convertir

            </button>


            <!-- RESULTADO -->

            <div
                id="resultado"
                class="resultado"
            >

                Resultado: —

            </div>


        </div>

    </div>


    <script src="conversor.js"></script>

</body>

</html>
