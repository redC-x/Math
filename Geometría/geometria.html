<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Geometría - Math</title>

    <link
        rel="stylesheet"
        href="geometria.css"
    >

</head>

<body>

    <div class="geometria">

        <button
            class="boton-volver"
            onclick="window.location.href='../index.html'">

            ← Volver al menú

        </button>


        <h1>📐 Geometría</h1>


        <div class="geometria-panel">

            <label for="figura">
                Selecciona una figura:
            </label>

            <select id="figura">

                <option value="cuadrado">
                    Cuadrado
                </option>

                <option value="rectangulo">
                    Rectángulo
                </option>

                <option value="triangulo">
                    Triángulo
                </option>

                <option value="circulo">
                    Círculo
                </option>

            </select>


            <div id="campos"></div>


            <button
                class="boton-calcular"
                onclick="calcular()">

                📐 Calcular

            </button>


            <div
                id="resultado"
                class="resultado">

                <p>Resultado: —</p>

            </div>

        </div>

    </div>


    <script src="geometria.js"></script>

</body>

</html>
